frontier_explorer_node:
  ros__parameters:
    use_sim_time: true
    explore_period_sec: 3.0
    obstacle_search_radius_cells: 1
    min_frontier_cluster_size: 1
    min_goal_distance_m: 0.45
    max_retry_count: 2
    frontier_decision:
      max_cluster_retry_count: 3
      defer_small_clusters: true
      small_cluster_size_threshold: 3
      weight_distance: 1.0
      weight_cluster_size: 1.0
      weight_clearance: 0.25
      weight_retry_penalty: 1.0
      weight_unknown_risk_penalty: 1.0
      weight_information_gain: 0.0
      weight_revisit_penalty: 0.0
      enable_clearance_score: true
      enable_unknown_risk_penalty: true
      enable_information_gain_score: false
      enable_revisit_penalty: false
      candidate_unknown_margin_cells: 2
      candidate_max_unknown_ratio: 0.4
    map_stale_timeout_ms: 5000
    max_frontier_failures: 3
    edge_tolerance_m: 0.3
    goal_reached_tolerance_m: 0.05
    map_topic: /map
    global_costmap_topic: /global_costmap/costmap
    use_global_costmap_for_safety: true
    enable_internal_navigation_loop: false

exploration_bt_orchestrator_node:
  ros__parameters:
    use_sim_time: true
    frontier_goal_service: /frontier_explorer_node/get_next_frontier_goal
    mark_failed_service: /frontier_explorer_node/mark_frontier_failed
    navigate_to_pose_action: navigate_to_pose
    tick_period_sec: 0.1
    service_retry_delay_sec: 2.0
