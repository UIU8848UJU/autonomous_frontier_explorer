frontier_strategy_node:
  ros__parameters:
    use_sim_time: true
    obstacle_search_radius_cells: 1
    min_frontier_cluster_size: 2
    min_goal_distance_m: 0.45
    max_retry_count: 2
    # 当前为仿真车型的配置几何；实机标定后只替换为 polygon 与标定产物元数据。
    robot_geometry:
      shape: circle
      frame_id: base_link
      source: configured_simulation_profile
      revision: 1
    frontier_decision:
      max_cluster_retry_count: 3
      defer_small_clusters: true
      small_cluster_size_threshold: 5
      enable_reachability_filter: false
      require_reachable_goal: false
      max_reachability_checks: 6
      compute_path_to_pose_action: compute_path_to_pose
      reachability_server_timeout_ms: 200
      reachability_check_timeout_ms: 500
      reachability_planner_id: ""
      candidate_unknown_margin_cells: 2
      candidate_goal_inset_cells: 3
      candidate_max_unknown_ratio: 0.25
      cleanup_enabled: true
      cleanup_trigger_no_candidate_cycles: 3
      cleanup_trigger_only_small_clusters: true
      cleanup_min_cluster_size: 1
      cleanup_min_goal_distance_m: 0.0
      cleanup_goal_inset_cells: 0
      cleanup_candidate_max_unknown_ratio: 0.40
      viewpoint_retreat_distances_m: [0.25, 0.40]
      viewpoint_sample_radii_m: [0.35, 0.55]
      viewpoint_angle_step_deg: 30.0
      # 仿真阶段与 Nav2 local/global costmap 的 raytrace_max_range 保持一致。
      information_gain:
        enabled: true
        sensor_range_m: 3.0
        minimum_area_m2: 0.0
        saturation_area_m2: 1.0
        weight: 0.4
      # 开启后，下列米制参数会按 OccupancyGrid.resolution 换算为 Core 的 cell 参数。
      map_adaptation:
        enabled: true
        obstacle_clearance_m: 0.05
        min_frontier_length_m: 0.10
        small_frontier_length_m: 0.25
        candidate_unknown_margin_m: 0.10
        candidate_goal_inset_m: 0.15
        cleanup_goal_inset_m: 0.0
      enable_footprint_filter: true
      allow_unknown_footprint: false
      robot_radius: 0.1
      footprint_padding: 0.0
      footprint_cost_threshold: 253
    map_stale_timeout_ms: 5000
    max_frontier_failures: 3
    map_topic: /map
    global_costmap_topic: /global_costmap/costmap
    use_global_costmap_for_safety: true
    global_frame: map
    robot_base_frame: base_link
    robot_pose_timeout_ms: 200
    stable_no_frontier_cycles: 3
    show_all_candidate_markers: true

navigation_node:
  ros__parameters:
    use_sim_time: true
    robot_geometry:
      shape: circle
      frame_id: base_link
      source: configured_simulation_profile
      revision: 1
    navigation_action: ~/navigate_to_pose
    check_pose_reachability_service: ~/check_pose_reachability
    check_goal_feasibility_service: ~/check_goal_feasibility
    navigate_to_pose_action: navigate_to_pose
    compute_path_to_pose_action: compute_path_to_pose
    footprint_costmap_topic: /global_costmap/costmap
    enable_footprint_collision_check: true
    allow_unknown_footprint: false
    enable_path_safety_check: true
    allow_unknown_path: false
    robot_radius: 0.1
    footprint_padding: 0.0
    footprint_cost_threshold: 253
    path_cost_threshold: 253
    reachability_planner_id: ""
    nav2_server_timeout_ms: 1000
    reachability_timeout_ms: 2000
